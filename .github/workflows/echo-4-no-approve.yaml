name: echo-4-no-approve

on:
  push:
    tags:
      - 'v*'
    
jobs:
  echo-4-no-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Echo
        run: |
          echo "Hello, world 4!"

      - name: Echo repository variables (secure method)
        env:
          # セキュリティのため、中間環境変数を使用
          ONLY_REPO_VAR_TEST: ${{ vars.ONLY_REPO_VAR_TEST }}
          TEST: ${{ vars.TEST }}
        run: |
          echo "=== Repository Variables ==="
          echo "ONLY_REPO_VAR_TEST: $ONLY_REPO_VAR_TEST"
          echo "TEST: $TEST"
          echo "==========================="
