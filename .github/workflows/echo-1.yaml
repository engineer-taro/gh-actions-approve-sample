name: echo-1

on:
  push:
    tags:
      - 'v*'
    
jobs:
  echo-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Echo
        run: |
          echo "Hello, world 1!"

      - name: Echo repository variables (secure method)
        env:
          # セキュリティのため、中間環境変数を使用
          ONLY_REPO_VAR_TEST: ${{ vars.ONLY_REPO_VAR_TEST }}
          TEST: ${{ vars.TEST }}
        run: |
          echo "=== Repository Variables ==="
          echo "ONLY_REPO_VAR_TEST: $ONLY_REPO_VAR_TEST"
          echo "TEST: $TEST"
          echo "==========================="
